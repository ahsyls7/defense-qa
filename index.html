        q: "宽域信号覆盖？",
        keywords: [],
        a: "（1）仪器可测试的电位信号DC-5.4KHz。（2）由于尺度效应影响，大地电位信号0.001～1000 Hz，采矿尺度煤岩破坏电位信号2KHz以内，根据香农采样定理，只要采样频率大于或等于有效信号最高频率的两倍,采样值就可以包含原始信号的所有信息，被采样的信号就可以不失真地还原成原始信号。利用最大5.4KHz的仪器采频能覆盖电位信号频域。"
      },
      {
        id: 17,
        q: "100%识别灾害？",
        keywords: [],
        a: "（1）仪器可测试的电位信号DC-5.4KHz。（2）由于尺度效应影响，大地电位信号0.001～1000 Hz，采矿尺度煤岩破坏电位信号2KHz以内，根据香农采样定理，只要采样频率大于或等于有效信号最高频率的两倍,采样值就可以包含原始信号的所有信息，被采样的信号就可以不失真地还原成原始信号。利用最大5.4KHz的仪器采频能覆盖电位信号频域。"
      }
    ];

    const STORAGE_KEY = "agy_defense_qa_v2";
    let qaData = loadData();
    let allExpanded = false;

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_QA));
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(qaData));
    }

    function render(filter = "") {
      const container = document.getElementById("qaContainer");
      container.innerHTML = "";
      const kw = filter.trim().toLowerCase();

      qaData.forEach((item, idx) => {
        const text = (item.q + " " + item.keywords.join(" ") + " " + item.a).toLowerCase();
        if (kw && !text.includes(kw)) return;

        const card = document.createElement("div");
        card.className = "qa-card" + (allExpanded || kw ? " open" : "");

        const header = document.createElement("div");
        header.className = "qa-header";
        header.innerHTML = `
          <div class="qa-title"><span class="qa-num">Q${item.id}</span>${item.q}</div>
          <div class="qa-toggle">${card.classList.contains("open") ? "收起 ▲" : "展开 ▼"}</div>
        `;
        header.addEventListener("click", () => {
          card.classList.toggle("open");
          header.querySelector(".qa-toggle").textContent = card.classList.contains("open") ? "收起 ▲" : "展开 ▼";
        });

        const body = document.createElement("div");
        body.className = "qa-body";

        const kwRow = document.createElement("div");
        kwRow.className = "keywords-row";
        kwRow.innerHTML = `<span class="kw-label">关键词：</span>` + item.keywords.map(k => `<span class="kw-tag">${k}</span>`).join("");

        const editable = document.createElement("div");
        editable.className = "editable-area";
        editable.contentEditable = "true";
        editable.textContent = item.a;

        const footer = document.createElement("div");
        footer.className = "card-footer";
        footer.innerHTML = `<span>点击上方文字可直接编辑</span><span class="save-status">已自动保存 ✓</span>`;
        const statusEl = footer.querySelector(".save-status");

        editable.addEventListener("input", () => {
          qaData[idx].a = editable.innerText;
          saveData();
          statusEl.classList.add("show");
          clearTimeout(editable._t);
          editable._t = setTimeout(() => statusEl.classList.remove("show"), 1500);
        });

        body.appendChild(kwRow);
        body.appendChild(editable);
        body.appendChild(footer);
        card.appendChild(header);
        card.appendChild(body);
        container.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", (e) => render(e.target.value));

    document.getElementById("toggleAllBtn").addEventListener("click", (e) => {
      allExpanded = !allExpanded;
      e.target.textContent = allExpanded ? "全部收起" : "全部展开";
      render(document.getElementById("searchInput").value);
    });

    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(qaData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "答辩QA备份.json";
      a.click();
    });

    document.getElementById("importJsonBtn").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed)) {
            qaData = parsed;
            saveData();
            render(document.getElementById("searchInput").value);
            alert("导入成功！");
          }
        } catch (err) {
          alert("JSON 格式无效");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("确定要恢复为初始内容吗？当前修改将被覆盖。")) {
        qaData = JSON.parse(JSON.stringify(DEFAULT_QA));
        saveData();
        render(document.getElementById("searchInput").value);
      }
    });

    render();
  </script>
</body>
</html>
